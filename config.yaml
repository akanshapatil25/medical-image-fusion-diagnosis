seed: 42
data:
  raw_dir: data/raw/brisc2025
  processed_dir: data/processed
  splits_dir: data/splits/brisc
  image_size: 224
  validation_fraction: 0.1
  classes:
    - glioma
    - meningioma
    - pituitary
    - no_tumor
training:
  batch_size: 16
  epochs: 30
  learning_rate: 0.0005
  weight_decay: 0.0001
  patience: 6
  num_workers: 0
  device: auto
  loss:
    class_weighting: true
    label_smoothing: 0.03
  augmentation:
    enabled: true
    horizontal_flip_probability: 0.5
    rotation_degrees: 7
    brightness_delta: 0.08
    contrast_delta: 0.08
  scheduler:
    patience: 2
    factor: 0.5
    min_lr: 0.000001
model:
  input_channels: 1
  dropout: 0.25
  channels: [16, 32, 64, 128]
